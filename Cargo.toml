[workspace]
resolver = "2"
members = [
    "edge/daqcore-core",
    "edge/daqcore-driver",
    "edge/daqcore-wal",
    "edge/daqcore-agent",
    "edge/daqcore-ethercat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Default license for the open-source edge crates. The cloud/ backend will be
# licensed separately (LICENSE-COMMERCIAL) and must NOT inherit this default.
license = "Apache-2.0"
authors = ["DAQcore contributors"]
repository = "https://github.com/Axj-b/DAQcore"

[workspace.dependencies]
daqcore-core = { path = "edge/daqcore-core", version = "0.1.0" }
daqcore-driver = { path = "edge/daqcore-driver", version = "0.1.0" }
daqcore-wal = { path = "edge/daqcore-wal", version = "0.1.0" }
daqcore-ethercat = { path = "edge/daqcore-ethercat", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastrand = "2"
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
sysinfo = "0.33"

[profile.release]
lto = "thin"
